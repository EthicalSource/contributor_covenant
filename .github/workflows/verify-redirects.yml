---
name: Verify redirects

on:
  pull_request:
    paths:
      - .netlify.toml
      - content/version/3/0/**
      - hugo.toml
      - static/_redirects
      - static/scripts/builder.js
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-redirects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Hugo
        run: |
          HUGO_VERSION="0.155.0"
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -O hugo.deb
          sudo dpkg -i hugo.deb
          hugo version
      - name: Build site
        run: hugo --quiet
      - name: Verify uppercase file exists
        run: |
          if [ -f "public/version/3/0/code_of_conduct/CODE_OF_CONDUCT.md" ]; then
            echo "::info::✓ CODE_OF_CONDUCT.md exists"
          else
            echo "::error::✗ CODE_OF_CONDUCT.md does NOT exist"
            exit 1
          fi
      - name: Verify cased filenames
        run: |
          echo "Files generated by Hugo:"
          ls -la public/version/3/0/code_of_conduct/*.md 2>/dev/null || true

          if [ -f "public/version/3/0/code_of_conduct/code_of_conduct.md" ]; then
            echo "::error::✗ code_of_conduct.md exists (should NOT exist)"
            exit 1
          else
            echo "::info::✓ code_of_conduct.md does NOT exist (correct - redirect will work)"
          fi

          # Verify uppercase exists
          if [ -f "public/version/3/0/code_of_conduct/CODE_OF_CONDUCT.md" ]; then
            echo "::info::✓ CODE_OF_CONDUCT.md exists (correct)"
          else
            echo "::error::✗ CODE_OF_CONDUCT.md NOT found"
            exit 1
          fi
      - name: Verify _redirects file exists
        run: |
          if [ -f "public/_redirects" ]; then
            echo "::info::✓ _redirects file exists"
            cat public/_redirects
          else
            echo "::error::✗ _redirects file does NOT exist"
            exit 1
          fi
      - name: Verify redirect rule exists
        run: |
          if grep -q "/version/3/0/code_of_conduct/code_of_conduct.md.*CODE_OF_CONDUCT.md" public/_redirects; then
            echo "::info::✓ Redirect rule found in _redirects"
          else
            echo "::error::✗ Redirect rule NOT found in _redirects"
            exit 1
          fi
